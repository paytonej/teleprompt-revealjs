title: teleprompt-revealjs
description: A Quarto Revealjs format extension for smart board and teleprompter use.
author: Eric J Payton
version: 1.0.0
quarto-required: ">=1.7.0"
contributes:
  formats:
    revealjs:
      code-annotations: select
      theme: teleprompt.scss
      background-color: black
      slide-number: c/t
      width: 1920
      height: 1080
      incremental: false
      controls: false
      progress: false
      history: true
      navigation-mode: linear
      embed-resources: true
      mermaid:
        theme: dark
      html-math-method:
        method: mathjax
        url: "https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"
      filters:
        - resources/scripts/apply-background-color.lua
        - resources/notes-as-subtitle.lua
        - resources/scripts/slide-nonincremental.lua
      include-in-header:
        - text: |
            <style>
              body:has(.present.hide-logo) {
              --logo-display: none;
                }
            .slide-logo {
              display: var(--logo-display, block) !important;
                }
            .reveal aside.notes,
            .reveal .slides section .notes {
              display: none !important;
                }
              </style>
      include-after-body:
        - resources/load-fonts.html
        - resources/ucinci-nav.js
        - resources/coeos.html
        - resources/subtitle-overlay.js
      template-partials:
        - resources/revealjs-partials/title-slide.html
        - resources/revealjs-partials/template.html
        - resources/revealjs-partials/toc-slide.html
      css:
        - resources/revealjs-supplement.css
        - resources/annotation-dark.css
        - resources/subtitle.css
      resources: 
        - _extensions/paytonej/teleprompt/content/images/*
